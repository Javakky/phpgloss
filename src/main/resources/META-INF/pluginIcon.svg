<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- PHPDoc の型注釈を IDE が読み解く、という中身をそのまま形にする。
       左のブロックが書かれた PHPDoc、右へ伸びる矢印が解決、右のブロックが解けた型。 -->
  <rect x="3" y="9" width="13" height="22" rx="2.5" fill="none" stroke="#4A87C4" stroke-width="2"/>
  <line x1="6.5" y1="15" x2="12.5" y2="15" stroke="#4A87C4" stroke-width="2" stroke-linecap="round"/>
  <line x1="6.5" y1="20" x2="12.5" y2="20" stroke="#4A87C4" stroke-width="2" stroke-linecap="round"/>
  <line x1="6.5" y1="25" x2="10" y2="25" stroke="#4A87C4" stroke-width="2" stroke-linecap="round"/>

  <path d="M18 20 L25 20" stroke="#62B543" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M22 16.5 L25.5 20 L22 23.5" fill="none" stroke="#62B543" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M30 10 L36 10 L36 30 L30 30" fill="none" stroke="#62B543" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
