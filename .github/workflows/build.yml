name: Build

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへの押し直しでは、走っている検証を止めて最新だけを見る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # プラットフォームと PHP プラグインの JAR は Java 25 のバイトコードで、
      # 古い JDK では読めない
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # 設定キャッシュは、外部への問い合わせが失敗したときにビルドごと落とす。
      # CI では毎回まっさらに組み立てる
      - name: Test
        run: ./gradlew clean test --no-configuration-cache

      - name: Build
        run: ./gradlew buildPlugin --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: build/distributions/*.zip

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: build/reports/tests/test

  # 対応すると宣言した IDE すべてに対する検証。IDE を落としてくるうえ、JetBrains の
  # リリース一覧を引くため、ネットワーク次第で落ちる。テストの結果とは分けて見る
  verify:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify against every supported IDE
        run: ./gradlew verifyPlugin --no-configuration-cache

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: build/reports/pluginVerifier
